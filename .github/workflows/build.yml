name: build-widget-apk

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write      # publish the APK as a release asset (public download, no auth)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-widget-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Public download without any login: the phone fetches this asset directly.
      - name: Publish to a rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DSH widget (latest build)
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
